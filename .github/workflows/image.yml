name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checksums match the pinned versions
        run: |
          ./update-checksums.sh >/dev/null
          git diff --exit-code Dockerfile || { echo "::error::run ./update-checksums.sh and commit the result"; exit 1; }
      - name: Build
        run: docker build -t "$IMAGE:ci" .
      - name: Test
        run: docker run --rm --entrypoint arc-runner-test "$IMAGE:ci"
      - name: Push
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tags=("sha-${GITHUB_SHA::7}")
          if [[ $GITHUB_REF == refs/tags/v* ]]; then tags+=("${GITHUB_REF#refs/tags/}"); fi
          for t in "${tags[@]}"; do
            docker tag "$IMAGE:ci" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
